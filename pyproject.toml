[project]
name = "fullawake"
version = "0.1.0"
description = "Sensory and embodiment gateway connecting phone Xiaoman (DSHA) to PC desktop capabilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pillow>=10.0.0",
    "mss>=9.0.0",
    "pywin32>=306",
    "pydantic>=2.0.0",
    "sse-starlette>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "gateway", "capabilities"]
